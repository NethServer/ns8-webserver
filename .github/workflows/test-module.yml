name: Test module

on:
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Debug shell"
        required: true
        type: boolean
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

jobs:
  run_tests:
    uses: NethServer/ns8-github-actions/.github/workflows/test-module-qemu.yml@feat-qemu-workflows
    with:
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' || false }}
      # Install on a clean node, and upgrade from the last release.
      scenarios: '["install","update"]'
      # Every other input keeps its default. Uncomment a line to change it.
      #
      # When to take the UI screenshots: always, on_ui_change,
      # on_renovate_ui_change or never.
      # ui_tests_strategy: on_renovate_ui_change
      # ui_test_distro: rocky9
      # ui_test_scenario: install
      #
      # Guests to test on, one runner and one VM each: rocky9, debian12, debian13.
      # distros: '["rocky9","debian13"]'
      # Release tag the update scenario starts from. Empty picks the latest release.
      # update_from: "1.3.10"
      #
      # ns8-core to install. A dev core needs both lines.
      # corebranch: ns8-stable
      # install_args: ghcr.io/nethserver/core:3.22.0-dev.6
      #
      # The VM. A public runner has 4 vCPUs and 15 GiB, so 12288 MiB is the
      # practical ceiling for vm_mem. A larger runner lifts it.
      # vm_mem: 8192
      # vm_cpus: 4
      # disk_size: 30G
      # timeout_minutes: 60
      # runs_on: ubuntu-24.04
